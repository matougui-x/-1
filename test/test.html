<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单元测试 · 校园失物招领</title>
  <link rel="stylesheet" href="lib/mocha.css">
  <style>
    :root {
      --green: #12A87A;
      --green-d: #0E8F68;
      --green-l: #E6F6F0;
      --ink: #1B1F23;
      --ink-2: #5A6470;
      --ink-3: #9AA3AE;
      --line: #EDF0F3;
      --bg: #F4F6F8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .page-head {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 22px 28px 18px;
    }
    .page-head h1 {
      margin: 0 0 8px;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-head h1 .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }
    .page-head p {
      margin: 0 0 4px;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.7;
    }
    .page-head code {
      background: var(--green-l);
      color: var(--green-d);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12px;
    }
    .page-head .tips {
      margin-top: 12px;
      background: var(--green-l);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: #0C7A5A;
      line-height: 1.7;
    }
    #mocha { margin: 18px 24px 60px; }
    #mocha h1 { font-size: 15px; margin-top: 4px; }
    #mocha h2 { font-size: 13px; }
    #mocha .test h2 { font-size: 13px; }
    #mocha-stats { position: static; margin-bottom: 10px; }
    #mocha-stats .progress { background-color: var(--green-l); }
    #mocha .suite .suite h1 { font-size: 13px; }
    #mocha .test.pass::before { color: var(--green); }
    #mocha .test.pass.fast.duration { color: var(--ink-3); }
  </style>
</head>
<body>

<div class="page-head">
  <h1><span class="dot"></span>校园失物招领 · 单元测试</h1>
  <p>这一页用 Mocha + Chai 对业务逻辑做单元测试，<strong>双击打开就会自动运行</strong>，不需要安装 Node.js，也不需要联网。</p>
  <p>被测代码：<code>js/config.js</code>、<code>js/utils.js</code>、<code>js/store.js</code>、<code>js/seed.js</code>；用例：<code>test/specs/*.spec.js</code></p>
  <div class="tips">
    <strong>怎么看结果：</strong>下面每个 <span style="color:#0E8F68">✓</span> 表示一条用例通过，出现红色 ✗ 会同时打印期望值与实际值。
    右上角统计里的 <strong>passing / failing</strong> 就是通过和失败的数量。全部通过时页面不会弹出任何报错。
  </div>
</div>

<div id="mocha"></div>

<!-- 测试框架：本地文件，离线可用（获取方式见 lib/_fetch-libs.py） -->
<script src="lib/mocha.js"></script>
<script src="lib/chai.js"></script>
<script>
  mocha.setup({ ui: 'bdd', timeout: 5000, slow: 100 });
</script>

<!-- 被测代码：与页面加载的是同一批文件 -->
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/store.js"></script>
<script src="../js/seed.js"></script>

<!-- 测试夹具与用例 -->
<script src="specs/helpers.js"></script>
<script src="specs/validate.spec.js"></script>
<script src="specs/query.spec.js"></script>
<script src="specs/privacy.spec.js"></script>
<script src="specs/verify.spec.js"></script>
<script src="specs/storage.spec.js"></script>
<script src="specs/e2e.spec.js"></script>

<script>
  var runner = mocha.run();

  // 把结果写到 <html> 的属性上，方便用命令行自动化检查
  // （浏览器里 JS 报错时进程退出码仍是 0，光看退出码判断不了成败）
  runner.on('end', function () {
    var stats = runner.stats;
    document.documentElement.setAttribute(
      'data-selftest',
      (stats.failures ? 'FAIL' : 'PASS') +
      '|passing=' + stats.passes +
      '|failing=' + stats.failures +
      '|duration=' + stats.duration + 'ms'
    );
  });
</script>
</body>
</html>
