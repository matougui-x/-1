<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A94A0"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12A87A"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D98209"/>
    </marker>
  </defs>

  <rect width="900" height="1120" fill="#F4F6F8"/>
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#1B1F23">认领验证流程图（防冒领的关键实现）</text>
  <text x="40" y="68" font-size="13" fill="#5A6470">把「谁有资格看到联系方式」这件事，从口头约定变成了程序里的判断</text>

  <!-- 开始 -->
  <rect x="330" y="92" width="140" height="40" rx="20" fill="#12A87A"/>
  <text x="400" y="118" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">开始</text>

  <path d="M 400 132 L 400 158" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>

  <!-- 入口 -->
  <rect x="230" y="160" width="340" height="52" rx="10" fill="#FFFFFF" stroke="#D6DCE3"/>
  <text x="400" y="192" font-size="13.5" fill="#1B1F23" text-anchor="middle">在信息详情页点击「🔒 我要认领（需验证）」</text>

  <path d="M 400 212 L 400 236" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>

  <!-- 判断 1：需要验证吗 -->
  <path d="M 400 240 L 540 300 L 400 360 L 260 300 Z" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.5"/>
  <text x="400" y="306" font-size="13" fill="#1B1F23" text-anchor="middle">这条信息需要验证吗？</text>

  <!-- 否：直接显示联系方式 -->
  <path d="M 540 300 L 700 300" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>
  <text x="620" y="291" font-size="12" fill="#9AA3AE" text-anchor="middle">否</text>
  <rect x="704" y="274" width="164" height="52" rx="10" fill="#FFFFFF" stroke="#D6DCE3"/>
  <text x="786" y="296" font-size="12.5" fill="#1B1F23" text-anchor="middle">直接显示联系方式</text>
  <text x="786" y="314" font-size="11.5" fill="#9AA3AE" text-anchor="middle">（寻物信息走这条）</text>

  <path d="M 400 360 L 400 386" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>
  <text x="414" y="378" font-size="12" fill="#9AA3AE">是</text>

  <!-- 判断 2：还有次数吗 -->
  <path d="M 400 390 L 540 450 L 400 510 L 260 450 Z" fill="#FFF9EC" stroke="#D98209" stroke-width="1.5"/>
  <text x="400" y="448" font-size="13" fill="#1B1F23" text-anchor="middle">剩余尝试次数 &gt; 0 ？</text>
  <text x="400" y="468" font-size="11.5" fill="#B26A00" text-anchor="middle">（初始 3 次）</text>

  <!-- 否：锁定 -->
  <path d="M 540 450 L 700 450" stroke="#D98209" stroke-width="2" marker-end="url(#ao)"/>
  <text x="620" y="441" font-size="12" fill="#D98209" text-anchor="middle">否</text>
  <rect x="704" y="424" width="164" height="52" rx="10" fill="#FFF9EC" stroke="#F0D9A8"/>
  <text x="786" y="446" font-size="12.5" fill="#8A6100" text-anchor="middle">已锁定</text>
  <text x="786" y="464" font-size="11.5" fill="#B26A00" text-anchor="middle">引导「申请人工核对」</text>

  <path d="M 400 510 L 400 536" stroke="#12A87A" stroke-width="2" marker-end="url(#ag)"/>
  <text x="414" y="528" font-size="12" fill="#0E8F68">是</text>

  <!-- 抽题 -->
  <rect x="230" y="538" width="340" height="54" rx="10" fill="#FFFFFF" stroke="#B7E6D5"/>
  <text x="400" y="561" font-size="13.5" fill="#1B1F23" text-anchor="middle" font-weight="bold">系统随机抽取 2 项隐藏特征</text>
  <text x="400" y="580" font-size="11.5" fill="#5A6470" text-anchor="middle">抽中的题目名记在待办里，提交时只认这 2 题</text>

  <path d="M 400 592 L 400 616" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>

  <!-- 显示题目 -->
  <rect x="230" y="618" width="340" height="50" rx="10" fill="#FFFFFF" stroke="#D6DCE3"/>
  <text x="400" y="648" font-size="13.5" fill="#1B1F23" text-anchor="middle">展示题目（题目对象里不含答案）</text>

  <path d="M 400 668 L 400 692" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>

  <!-- 提交 -->
  <rect x="230" y="694" width="340" height="50" rx="10" fill="#FFFFFF" stroke="#D6DCE3"/>
  <text x="400" y="724" font-size="13.5" fill="#1B1F23" text-anchor="middle">用户填写答案并提交</text>

  <path d="M 400 744 L 400 768" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>

  <!-- 比对 -->
  <rect x="230" y="770" width="340" height="50" rx="10" fill="#FFFFFF" stroke="#D6DCE3"/>
  <text x="400" y="793" font-size="13.5" fill="#1B1F23" text-anchor="middle">归一化后逐项与答案比对</text>
  <text x="400" y="811" font-size="11.5" fill="#9AA3AE" text-anchor="middle">去空格、全角转半角、忽略大小写与标点</text>

  <path d="M 400 820 L 400 844" stroke="#8A94A0" stroke-width="2" marker-end="url(#a)"/>

  <!-- 判断 3：全对？ -->
  <path d="M 400 848 L 540 908 L 400 968 L 260 908 Z" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.5"/>
  <text x="400" y="914" font-size="13" fill="#1B1F23" text-anchor="middle">全部答对？</text>

  <!-- 否：扣一次，回到判断 2 -->
  <path d="M 260 908 L 140 908" stroke="#D98209" stroke-width="2" marker-end="url(#ao)"/>
  <text x="200" y="899" font-size="12" fill="#D98209" text-anchor="middle">否</text>
  <rect x="30" y="882" width="106" height="52" rx="10" fill="#FFF9EC" stroke="#F0D9A8"/>
  <text x="83" y="904" font-size="12.5" fill="#8A6100" text-anchor="middle">扣 1 次</text>
  <text x="83" y="922" font-size="12.5" fill="#8A6100" text-anchor="middle">尝试机会</text>

  <path d="M 83 882 L 83 450 L 256 450" stroke="#D98209" stroke-width="2" fill="none" stroke-dasharray="7 4" marker-end="url(#ao)"/>
  <text x="106" y="602" font-size="12" fill="#B26A00" transform="rotate(-90 106 602)">次数用完则锁定</text>

  <!-- 是：通过 -->
  <path d="M 400 968 L 400 992" stroke="#12A87A" stroke-width="2" marker-end="url(#ag)"/>
  <text x="414" y="986" font-size="12" fill="#0E8F68">是</text>

  <rect x="200" y="994" width="400" height="62" rx="10" fill="#E6F6F0" stroke="#12A87A" stroke-width="1.5"/>
  <text x="400" y="1018" font-size="13.5" font-weight="bold" fill="#0E8F68" text-anchor="middle">生成认领凭证码 CL-YYYY-XXXX，解锁联系方式</text>
  <text x="400" y="1041" font-size="11.5" fill="#0E8F68" text-anchor="middle">同时在本机记下「这条已解锁」，之后再看详情无需重复验证</text>

  <!-- 侧栏说明 -->
  <rect x="640" y="994" width="230" height="62" rx="10" fill="#FFFFFF" stroke="#D6DCE3"/>
  <text x="755" y="1016" font-size="12" fill="#1B1F23" text-anchor="middle">验证记录写回信息</text>
  <text x="755" y="1035" font-size="11.5" fill="#5A6470" text-anchor="middle">发布者在「我的发布」里</text>
  <text x="755" y="1050" font-size="11.5" fill="#5A6470" text-anchor="middle">可以看到谁问过、答得对不对</text>

  <!-- 图例 -->
  <rect x="40" y="100" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#EDF0F3"/>
  <text x="54" y="122" font-size="12" font-weight="bold" fill="#5A6470">图例</text>
  <path d="M 56 138 L 76 138 L 66 128 Z" fill="#FFFFFF" stroke="#8A94A0"/>
  <text x="86" y="142" font-size="11.5" fill="#5A6470">判断分支</text>
  <rect x="56" y="148" width="20" height="14" rx="4" fill="#FFF9EC" stroke="#F0D9A8"/>
  <text x="86" y="159" font-size="11.5" fill="#5A6470">失败 / 阻断路径</text>
  <rect x="56" y="166" width="20" height="14" rx="4" fill="#E6F6F0" stroke="#12A87A"/>
  <text x="86" y="177" font-size="11.5" fill="#5A6470">成功路径</text>
</svg>
